services:
  - type: web
    name: regattaresume
    env: python
    runtime: python-3.11
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: regattaresume-db
          property: connectionString
      - key: ENABLE_REGISTRATION
        value: true
      - key: ENABLE_PDF_EXPORT
        value: true
      # The ClubSpot scrape runs on GitHub Actions, not here: headless
      # Chrome does not fit in this container and OOM-killed the site.
      - key: SCRAPER_ENABLED
        value: false
      - key: GITHUB_REPO
        value: jacktheone0/regatta_resume
      - key: GITHUB_WORKFLOW_FILE
        value: scrape.yml
      - key: GITHUB_WORKFLOW_REF
        value: main
      # Fine-grained PAT with Actions: read/write, so the admin button can
      # start the workflow. Set its value in the Render dashboard.
      - key: GITHUB_WORKFLOW_TOKEN
        sync: false

databases:
  - name: regattaresume-db
    databaseName: regattaresume
    user: regattaresume
    region: oregon
    plan: free
