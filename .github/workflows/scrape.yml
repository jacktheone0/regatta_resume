name: ClubSpot scrape

# The ClubSpot scraper needs Chrome and ~1GB of RAM, which does not fit in
# the 512MB Render container it used to share with the web app (it OOM-killed
# the site). GitHub's runners have Chrome pre-installed and plenty of memory,
# and the scraper writes to Neon over the network, so it does not need to run
# on the web host at all.

on:
  schedule:
    # DAILY at 06:00 UTC while the historical backlog (~19,000 regattas) is
    # being drained: each run is bounded by SCRAPER_TIME_BUDGET_MIN and
    # continues where the last one stopped. Once the run summary reports
    # "backlog drained", this can go back to weekly: '0 6 * * 1'
    # (Monday 06:00 UTC = Sunday 22:00 PST / 23:00 PDT). GitHub cron is UTC
    # only and does not follow daylight saving.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max regattas to fetch from the API (blank = use the run cap)'
        required: false
        type: string
      start_year:
        description: 'Only scrape regattas from this year onwards (blank = all of ClubSpot history)'
        required: false
        default: ''
        type: string

# Never let two scrapes run at once: they would fight over the same regattas
concurrency:
  group: clubspot-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hosted runners cap at 6h; leave headroom so the job ends on its own terms
    timeout-minutes: 330

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FLASK_APP: app.py
      FLASK_ENV: production
      # Importing app.py must not start the in-process APScheduler here
      SCRAPER_ENABLED: 'false'
      # No regatta cap: the run is bounded by wall-clock time instead. It
      # stops cleanly at this many minutes (under timeout-minutes above, so
      # the run log is finalized and the summary step still runs); the next
      # run continues where it left off.
      SCRAPER_TIME_BUDGET_MIN: '300'
      SECRET_KEY: unused-by-the-scraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Chrome version
        run: google-chrome --version

      - name: Check the database connection
        run: |
          python - <<'PY'
          import os, sys
          if not os.environ.get('DATABASE_URL'):
              sys.exit('DATABASE_URL secret is not set. Add it under '
                       'Settings > Secrets and variables > Actions.')
          from app import app, db
          from sqlalchemy import text
          with app.app_context():
              db.session.execute(text('SELECT 1'))
          print('Database connection OK')
          PY

      - name: Run the ClubSpot scraper
        run: |
          flask scrape \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.start_year && format('--start-year {0}', inputs.start_year) || '' }}

      - name: Summarize the run
        if: always()
        run: |
          python - <<'PY'
          import os
          from app import app
          from models import ScraperLog
          with app.app_context():
              log = ScraperLog.query.order_by(ScraperLog.id.desc()).first()
              if not log:
                  print('No scraper log rows found.')
              else:
                  remaining = log.regattas_remaining or 0
                  minutes = (log.duration_seconds or 0) // 60
                  lines = [
                      f'**Status:** {log.status}',
                      f'**Regattas listed by the API:** {log.regattas_listed}',
                      f'**Skipped (already scraped, or checked empty and not due):** {log.regattas_skipped}',
                      f'**Visited this run:** {log.regattas_scraped} '
                      f'({log.regattas_empty or 0} had no results posted)',
                      f'**Results added:** {log.results_added}',
                      f'**Sailors added:** {log.sailors_added}',
                      f'**Time used:** {minutes} min',
                      f'**Still unscraped (backlog):** {remaining}',
                  ]
                  if log.error_message:
                      lines.append(f'**Note:** {log.error_message}')
                  if log.status == 'completed' and remaining == 0:
                      lines.append('**Catch-up status:** backlog drained. The daily schedule can '
                                   'go back to weekly -- see .github/SCRAPER_SETUP.md.')
                  else:
                      lines.append('**Catch-up status:** backlog remains; the next scheduled '
                                   'run continues from here.')
                  summary = '\n\n'.join(lines)
                  print(summary)
                  path = os.environ.get('GITHUB_STEP_SUMMARY')
                  if path:
                      with open(path, 'a') as f:
                          f.write('## ClubSpot scrape\n\n' + summary + '\n')
          PY
